      <circle cx="215" cy="170" r="11"/>
      <circle cx="246" cy="170" r="11"/>
      <circle cx="180" cy="217" r="11"/>
      <circle cx="211" cy="217" r="11"/>
      <circle cx="174" cy="265" r="11"/>
    </g>

    <g fill="#b65f30" stroke="#fff" stroke-width="4">
      <circle cx="304" cy="128" r="10"/>
      <circle cx="254" cy="128" r="10"/>
      <circle cx="126" cy="206" r="10"/>
      <circle cx="126" cy="256" r="10"/>
      <circle cx="426" cy="430" r="12"/>
    </g>

    <path d="M462 380L260 145" fill="none" stroke="#b65f30" stroke-width="5" marker-end="url(#arrowBrace)"/>
    <path d="M350 104H220" fill="none" stroke="#0f5b73" stroke-width="4" marker-end="url(#arrowBlue)"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
