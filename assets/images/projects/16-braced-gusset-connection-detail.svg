    <text x="626" y="122" fill="#111827" font-size="21" font-weight="800">Braced-frame</text>
    <text x="626" y="150" fill="#111827" font-size="21" font-weight="800">gusset connection</text>
    <text x="626" y="188" fill="#5f6974" font-size="16">Brace force, bolt group,</text>
    <text x="626" y="209" fill="#5f6974" font-size="16">plate, and weld checks</text>

    <path d="M596 258L274 185" fill="none" stroke="#0f5b73" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <text x="604" y="265" fill="#0f5b73" font-size="16" font-weight="800">Bolt pattern</text>

    <path d="M596 318L254 216" fill="none" stroke="#b65f30" stroke-width="3" marker-end="url(#arrowBrace)"/>
